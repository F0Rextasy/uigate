<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northwind Bakery</title>
<style>
@font-face {
  font-family: "Bakery Sans";
  src: url("bakery-sans.woff2") format("woff2");
}
:root {
  --ink: #1a1a1a;
  --paper: #ffffff;
  --accent: #0b5cad;
}
body {
  color: var(--ink);
  background-color: var(--paper);
  font-size: 16px;
  font-family: "Bakery Sans", Georgia, serif;
}
a:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.feature { color: #1a1a1a; background-color: #ffffff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
.review { color: #202020; background-color: #fafafa; border-radius: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); }
.note { font-size: 13px; color: #333333; background-color: #ffffff; }
</style>
</head>
<body>
<h1>Fresh bread every morning</h1>
<p>Our ovens run before sunrise so the shelves are full by seven.</p>
<img src="loaf.png" alt="A crusty sourdough loaf on a wooden counter">
<button style="width: 48px; height: 48px;">Buy</button>
</body>
</html>
